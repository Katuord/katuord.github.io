<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apex Studio V9.5 - Realtime Lua</title>

  <!-- MonacoとFengariの衝突回避 -->
  <script>
    window.tempDefine = window.define;
    window.define = undefined;
  </script>
  <script src="./fengari-web.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/fengari-web@0.1.4/dist/fengari-web.js';"></script>
  <script>
    window.define = window.tempDefine;
    delete window.tempDefine;
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs/loader.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark: #090a0f; --panel-bg: rgba(22, 24, 36, 0.75); --card-bg: rgba(31, 34, 51, 0.85);
      --accent-primary: #7c4dff; --accent-glow: rgba(124, 77, 255, 0.5); --accent-success: #00e676;
      --accent-success-glow: rgba(0, 230, 118, 0.6); --accent-error: #ff5252;
      --text-main: #e0e6ed; --text-sub: #90a4ae; --border-color: rgba(42, 46, 69, 0.8); --glass-blur: blur(16px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: radial-gradient(circle at top right, #1a1c29, var(--bg-dark)); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: background 0.3s ease; }
    ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #3a3f58; border-radius: 4px; } ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }
    
    .top-bar-container { background: var(--panel-bg); backdrop-filter: var(--glass-blur); border-bottom: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 100; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.4); }
    header { padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; }
    .brand { font-size: 1.3rem; font-weight: 900; background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%, #a770ef); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shine 3s linear infinite; display: flex; align-items: center; gap: 10px; }
    @keyframes shine { to { background-position: 200% center; } }
    
    .toolbar { display: flex; gap: 8px; align-items: center; }
    .icon-btn { background: transparent; border: 1px solid transparent; color: var(--text-sub); font-size: 13px; padding: 6px 10px; border-radius: 6px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 5px;}
    .icon-btn:hover { background: var(--card-bg); color: #fff; border-color: var(--border-color); }
    
    select, button { background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; outline: none; }
    select:hover, button:hover { border-color: var(--accent-primary); box-shadow: 0 0 10px var(--accent-glow); transform: translateY(-1px); }
    button.btn-run { background: linear-gradient(135deg, #00e676, #00c853); color: #000; border: none; padding: 8px 16px; box-shadow: 0 0 15px var(--accent-success-glow); animation: pulse-green 2s infinite; }
    button.btn-run:hover { transform: translateY(-2px) scale(1.05); box-shadow: 0 0 25px var(--accent-success-glow); animation: none; }
    @keyframes pulse-green { 0% { box-shadow: 0 0 10px rgba(0, 230, 118, 0.4); } 50% { box-shadow: 0 0 20px rgba(0, 230, 118, 0.8); } 100% { box-shadow: 0 0 10px rgba(0, 230, 118, 0.4); } }
    
    .workspace { display: flex; flex: 1; height: calc(100vh - 56px - 30px); }
    .sidebar { width: 220px; background: var(--panel-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .sidebar-header { padding: 12px 16px; font-size: 12px; font-weight: 800; color: var(--text-sub); border-bottom: 1px solid var(--border-color); background: rgba(0,0,0,0.2); }
    .snippet-list { flex: 1; overflow-y: auto; padding: 10px; }
    .snippet-item { padding: 10px 12px; border-radius: 6px; font-size: 12px; color: var(--text-sub); cursor: pointer; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); transition: all 0.2s; }
    .snippet-item:hover { background: var(--accent-primary); color: #fff; transform: translateX(4px); }
    
    .editor-wrapper { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }
    
    .editor-tabs { display: flex; background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--border-color); padding: 0 10px; align-items: center; height: 35px; }
    .file-tab { background: transparent; border: none; border-bottom: 2px solid transparent; color: var(--text-sub); padding: 0 15px; height: 100%; font-size: 12px; border-radius: 0; }
    .file-tab.active { color: #fff; border-bottom-color: var(--accent-primary); background: rgba(255,255,255,0.05); }
    .editor-tools { display: flex; gap: 5px; margin-left: auto; }
    
    #editor-container { flex: 1; height: 100%; width: 100%; }
    
    .output-panel { width: 450px; background: var(--panel-bg); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .panel-tabs { display: flex; background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border-color); align-items: center; justify-content: space-between; padding-right: 10px; }
    .tab-btn { padding: 10px 20px; border: none; background: transparent; color: var(--text-sub); font-size: 12px; border-bottom: 2px solid transparent; }
    .tab-btn.active { color: #fff; border-bottom-color: var(--accent-primary); background: var(--card-bg); }
    .tab-content { flex: 1; display: flex; flex-direction: column; padding: 16px; overflow-y: auto; }
    
    /* 描画用キャンバスエリア */
    #canvas-container { width: 100%; margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
    #screen-canvas { width: 100%; height: 150px; background: #000; border-radius: 8px; border: 1px solid var(--border-color); display: block; }
    
    #console-output { flex: 1; font-family: 'Fira Code', monospace; font-size: 14px; white-space: pre-wrap; word-break: break-all; background: rgba(0,0,0,0.4); padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); overflow-y: auto; scroll-behavior: smooth; min-height: 120px; }
    
    .exec-time { font-size: 11px; color: #ffeb3b; margin-top: 10px; border-top: 1px dashed var(--border-color); padding-top: 5px; text-align: right; }
    
    .ai-assist-card { background: rgba(124, 77, 255, 0.1); border-left: 4px solid var(--accent-primary); border-radius: 4px; padding: 12px; margin-top: 15px; font-size: 13px; animation: slideIn 0.3s ease-out; line-height: 1.5; }
    .ai-assist-card .ai-title { color: #b388ff; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; font-size: 14px; }
    .error-card { background: rgba(255, 82, 82, 0.1); border-left: 4px solid var(--accent-error); border-radius: 4px; padding: 12px; margin-bottom: 10px; color: #ff8a80; font-size: 13px; font-family: 'Fira Code', monospace;}
    @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    footer { height: 30px; background: var(--panel-bg); border-top: 1px solid var(--border-color); font-size: 11px; display: flex; align-items: center; padding: 0 16px; justify-content: space-between; color: var(--text-sub); }
    .metrics-bar { display: flex; gap: 15px; font-family: monospace; }
    .status-indicator { width: 10px; height: 10px; border-radius: 50%; background-color: var(--accent-success); margin-right: 8px; }
  </style>
</head>
<body>

  <div class="top-bar-container">
    <header>
      <div class="brand"><i class="fa-solid fa-code"></i> ApexStudio <span style="font-size:0.6rem; color:#ffeb3b;">V9.5 REALTIME-LUA</span></div>
      <div class="toolbar">
        <button class="icon-btn" title="コードを自動整形" onclick="formatCode()"><i class="fa-solid fa-wand-magic-sparkles"></i> 整形</button>
        <button class="icon-btn" title="コードをファイル保存" onclick="downloadCode()"><i class="fa-solid fa-download"></i> 保存</button>
        <button class="icon-btn" title="URLでコードを共有" onclick="shareCode()"><i class="fa-solid fa-link"></i> 共有</button>
        <div style="width: 1px; height: 20px; background: var(--border-color); margin: 0 5px;"></div>
        <select id="language" onchange="changeLanguage()">
          <option value="lua">Lua (リアルタイム)</option>
          <option value="javascript">JavaScript</option>
          <option value="python">Python</option>
        </select>
        <button class="btn-run" onclick="runCode()"><i class="fa-solid fa-bolt"></i> RUN</button>
      </div>
    </header>
  </div>

  <div class="workspace">
    <div class="sidebar">
      <div class="sidebar-header"><i class="fa-solid fa-layer-group"></i> ツールボックス (厳選スニペット)</div>
      <div class="snippet-list" id="snippet-list"></div>
    </div>
    
    <div class="editor-wrapper">
      <div class="editor-tabs">
        <button class="file-tab active" id="tab-1" onclick="switchTab(1)">File 1</button>
        <button class="file-tab" id="tab-2" onclick="switchTab(2)">File 2</button>
        <button class="file-tab" id="tab-3" onclick="switchTab(3)">File 3</button>
        <div class="editor-tools">
          <button class="icon-btn" title="文字を小さく" onclick="changeFontSize(-1)">A-</button>
          <button class="icon-btn" title="文字を大きく" onclick="changeFontSize(1)">A+</button>
          <button class="icon-btn" title="ミニマップ表示切替" onclick="toggleMinimap()"><i class="fa-solid fa-map"></i></button>
        </div>
      </div>
      <div id="editor-container"></div>
    </div>
    
    <div class="output-panel">
      <div class="panel-tabs">
        <button class="tab-btn active"><i class="fa-solid fa-terminal"></i> 画面描画 & ターミナル</button>
        <button class="icon-btn" title="画面とログを消去" onclick="clearConsole()"><i class="fa-solid fa-eraser"></i></button>
      </div>
      <div id="tab-console" class="tab-content">
        <div id="canvas-container">
          <canvas id="screen-canvas" width="400" height="150"></canvas>
        </div>
        <div id="console-output">実行待ち...</div>
      </div>
    </div>
  </div>

  <footer>
    <div style="display: flex; align-items: center;">
      <span id="status-dot" class="status-indicator"></span>
      <span id="status-text" style="font-weight:bold;">SYSTEM ONLINE</span>
    </div>
    <div class="metrics-bar">
      <div class="metrics-item">Ln <span id="cursor-ln">1</span>, Col <span id="cursor-col">1</span></div>
    </div>
  </footer>

  <script>
    let editor;
    let currentTab = 1;
    let editorFontSize = 15;
    let minimapEnabled = true;
    let wandboxCompilers = { python: 'cpython-3.11.4' };

    // --- 拡張版スニペット & Autocomplete ---
    const snippetDefinitions = {
      lua: [
        { label: "draw_rect", desc: "四角形を描画", code: "draw_rect(${1:x}, ${2:y}, ${3:width}, ${4:height}, \"${5:#00e676}\")" },
        { label: "clear_canvas", desc: "画面描画をクリア", code: "clear_canvas()" },
        { label: "play_sound", desc: "音を鳴らす (周波数, 秒数)", code: "play_sound(${1:440}, ${2:0.2})" },
        { label: "set_bg", desc: "背景色を変更", code: "set_bg(\"${1:#090a0f}\")" },
        { label: "print", desc: "コンソール出力", code: "print(${1})" },
        { label: "wait", desc: "指定秒数待機", code: "wait(${1:1})" },
        { label: "local function", desc: "関数定義", code: "local function ${1:name}(${2:args})\n\t${3}\nend" },
        { label: "for i=1,n", desc: "数値forループ", code: "for ${1:i} = ${2:1}, ${3:10} do\n\t${4}\nend" },
        { label: "for pairs", desc: "テーブル全要素ループ", code: "for ${1:key}, ${2:value} in pairs(${3:table}) do\n\t${4}\nend" },
        { label: "for ipairs", desc: "配列ループ", code: "for ${1:index}, ${2:value} in ipairs(${3:array}) do\n\t${4}\nend" },
        { label: "if", desc: "if文", code: "if ${1:condition} then\n\t${2}\nend" },
        { label: "while", desc: "whileループ", code: "while ${1:true} do\n\t${2}\nend" },
        { label: "math.random", desc: "乱数生成", code: "math.random(${1:min}, ${2:max})" },
        { label: "table.insert", desc: "配列に追加", code: "table.insert(${1:table}, ${2:value})" }
      ],
      javascript: [
        { label: "console.log", desc: "ログ出力", code: "console.log(${1});" },
        { label: "function", desc: "関数定義", code: "function ${1:name}(${2:args}) {\n\t${3}\n}" }
      ],
      python: [
        { label: "print", desc: "コンソール出力", code: "print(${1})" },
        { label: "def", desc: "関数定義", code: "def ${1:name}(${2:args}):\n\t${3}" }
      ]
    };

    function analyzeErrorAndSuggest(errText) {
        const text = errText.toLowerCase();
        let suggestion = "エラーの詳細を確認して修正してください。";
        let title = "🤖 AI エラー診断";
        const lineMatch = errText.match(/line\s+(\d+)/i) || errText.match(/:(\d+):/);
        const lineInfo = lineMatch ? `<div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1);">📍 <b>怪しい場所: <span style="color:#ffeb3b; font-size: 14px;">${lineMatch[1]}行目付近</span></b></div>` : "";

        if (text.includes("unexpected symbol") || text.includes("syntax error") || text.includes("invalid syntax")) {
            title = "🚨 【構文エラー】 打ち間違いがあります";
            suggestion = "<code>then</code> や <code>end</code> の閉じ忘れ、記号の付け忘れを確認してください。";
        } else if (text.includes("attempt to call a nil value")) {
            title = "🔍 【未定義エラー】 関数または変数がありません";
            suggestion = "呼び出そうとした関数が存在しません。名前のスペルを確認してください。";
        }
        return `<div class="ai-assist-card"><div class="ai-title"><i class="fa-solid fa-microchip"></i> ${title}</div><div>${suggestion}</div>${lineInfo}</div>`;
    }

    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.38.0/min/vs' } });
    require(['vs/editor/editor.main'], function () {
      monaco.editor.defineTheme('ultimate-dark', { base: 'vs-dark', inherit: true, rules: [{ background: '090a0f' }], colors: { 'editor.background': '#090a0f00' } });

      ['lua', 'javascript', 'python'].forEach(lang => {
          monaco.languages.registerCompletionItemProvider(lang, {
              provideCompletionItems: function(model, position) {
                  const word = model.getWordUntilPosition(position);
                  const range = { startLineNumber: position.lineNumber, endLineNumber: position.lineNumber, startColumn: word.startColumn, endColumn: word.endColumn };
                  const suggestions = (snippetDefinitions[lang] || []).map(snippet => ({
                      label: snippet.label,
                      kind: monaco.languages.CompletionItemKind.Snippet,
                      detail: snippet.desc,
                      insertText: snippet.code,
                      insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                      range: range
                  }));
                  return { suggestions: suggestions };
              }
          });
      });

      // 最初のサンプルコード（描画＋効果音付き）
      let initCode = `-- Apex Studio V9.5 画面描画&サウンドデモ\nclear_canvas()\nprint("音階アニメーションを開始します...")\n\nlocal notes = {261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25}\nlocal colors = {"#ff5252", "#ff9100", "#ffea00", "#00e676", "#00b0ff", "#651fff", "#d500f9", "#ffffff"}\n\nfor i = 1, #notes do\n    local x = (i - 1) * 45 + 20\n    draw_rect(x, 30, 35, 90, colors[i])\n    play_sound(notes[i], 0.15)\n    print("Note " .. i .. ": " .. math.floor(notes[i]) .. " Hz")\n    wait(0.2)\nend\n\nprint("完了！🎉")`;

      if (window.location.hash.startsWith('#code=')) {
          try { initCode = decodeURIComponent(escape(atob(window.location.hash.replace('#code=', '')))); window.location.hash = ''; } catch(e) {}
      } else {
          initCode = localStorage.getItem('apex_autosave_tab1') || initCode;
      }

      editor = monaco.editor.create(document.getElementById('editor-container'), {
        value: initCode, language: localStorage.getItem('apex_lang_tab1') || 'lua', theme: 'ultimate-dark', fontSize: editorFontSize, fontFamily: "'Fira Code', 'Consolas', monospace",
        automaticLayout: true, minimap: { enabled: minimapEnabled }, bracketPairColorization: { enabled: true }, autoClosingBrackets: "always", autoClosingQuotes: "always",
        formatOnPaste: true, formatOnType: true, wordWrap: "on", smoothScrolling: true, cursorBlinking: 'smooth', cursorSmoothCaretAnimation: "on",
        wordBasedSuggestions: "currentDocument", quickSuggestions: true, suggestOnTriggerCharacters: true
      });
      document.getElementById('language').value = localStorage.getItem('apex_lang_tab1') || 'lua';

      editor.onDidChangeModelContent(() => { localStorage.setItem(`apex_autosave_tab${currentTab}`, editor.getValue()); });
      editor.onDidChangeCursorPosition(e => { document.getElementById('cursor-ln').textContent = e.position.lineNumber; document.getElementById('cursor-col').textContent = e.position.column; });
      updateSidebarSnippets(document.getElementById('language').value);
    });

    function formatCode() { editor.getAction('editor.action.formatDocument').run(); }
    
    function clearConsole() { 
      document.getElementById('console-output').innerHTML = '<span style="color:var(--text-sub);">実行待ち...</span>'; 
      const cvs = document.getElementById('screen-canvas');
      if (cvs) {
        const ctx = cvs.getContext('2d');
        ctx.clearRect(0, 0, cvs.width, cvs.height);
      }
    }

    function changeFontSize(delta) { editorFontSize = Math.max(10, Math.min(30, editorFontSize + delta)); editor.updateOptions({ fontSize: editorFontSize }); }
    function toggleMinimap() { minimapEnabled = !minimapEnabled; editor.updateOptions({ minimap: { enabled: minimapEnabled } }); }

    function switchTab(tabNum) {
        document.querySelectorAll('.file-tab').forEach(t => t.classList.remove('active'));
        document.getElementById(`tab-${tabNum}`).classList.add('active');
        currentTab = tabNum;
        const savedCode = localStorage.getItem(`apex_autosave_tab${tabNum}`) || '';
        const savedLang = localStorage.getItem(`apex_lang_tab${tabNum}`) || 'lua';
        document.getElementById('language').value = savedLang;
        monaco.editor.setModelLanguage(editor.getModel(), savedLang);
        editor.setValue(savedCode);
        updateSidebarSnippets(savedLang);
    }

    function changeLanguage() {
        const lang = document.getElementById('language').value;
        monaco.editor.setModelLanguage(editor.getModel(), lang);
        localStorage.setItem(`apex_lang_tab${currentTab}`, lang);
        updateSidebarSnippets(lang);
    }

    function downloadCode() {
        const exts = { javascript: 'js', python: 'py', lua: 'lua' };
        const blob = new Blob([editor.getValue()], { type: 'text/plain' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `file_${currentTab}.${exts[document.getElementById('language').value]}`; a.click();
    }

    function shareCode() {
        try {
            const base64Code = btoa(unescape(encodeURIComponent(editor.getValue())));
            const url = `${window.location.origin}${window.location.pathname}#code=${base64Code}`;
            navigator.clipboard.writeText(url).then(() => alert('🔗 共有用URLをクリップボードにコピーしました！'));
        } catch(e) { alert('URLの生成に失敗しました。'); }
    }

    function updateSidebarSnippets(lang) {
      const list = document.getElementById('snippet-list'); list.innerHTML = '';
      (snippetDefinitions[lang] || []).forEach(item => {
        const div = document.createElement('div'); div.className = 'snippet-item'; 
        div.innerHTML = `<div style="display:flex; flex-direction:column; gap:2px;">
                            <span style="font-weight:bold; color:#fff;">${item.label}</span>
                            <span style="font-size:10px; color:var(--text-sub);">${item.desc}</span>
                         </div>
                         <i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>`;
        div.onclick = () => { editor.getContribution('snippetController2').insert(item.code); editor.focus(); }; 
        list.appendChild(div);
      });
    }

    function scrollToBottom(elem) { elem.scrollTop = elem.scrollHeight; }

    async function runCode() {
      const lang = document.getElementById('language').value; 
      const code = editor.getValue(); 
      const consoleOut = document.getElementById('console-output'); 
      consoleOut.innerHTML = ''; 

      const startTime = performance.now();

      if (lang === 'lua') {
        if (typeof fengari === 'undefined') {
          consoleOut.innerHTML = `<div class="error-card"><i class="fa-solid fa-triangle-exclamation"></i> <b>エラー:</b><br>Fengariライブラリの読み込みに失敗しました。</div>`;
          return;
        }
        try {
          const L = fengari.lauxlib.luaL_newstate();
          fengari.lualib.luaL_openlibs(L);

          // --- Lua拡張API登録 ---

          // 1. print(...)
          fengari.lua.lua_pushjsfunction(L, function(L_ptr) {
            const top = fengari.lua.lua_gettop(L_ptr);
            let strArr = [];
            for (let i = 1; i <= top; i++) {
              strArr.push(fengari.lua.lua_tojsstring(L_ptr, i));
            }
            const span = document.createElement('div');
            span.style.color = 'var(--accent-success)';
            span.textContent = strArr.join('\t');
            consoleOut.appendChild(span);
            scrollToBottom(consoleOut);
            return 0;
          });
          fengari.lua.lua_setglobal(L, fengari.to_luastring("print"));

          // 2. wait(sec)
          fengari.lua.lua_pushjsfunction(L, function(L_ptr) {
            const sec = fengari.lua.lua_tonumber(L_ptr, 1) || 0;
            fengari.lua.lua_pushnumber(L_ptr, sec);
            return fengari.lua.lua_yield(L_ptr, 1);
          });
          fengari.lua.lua_setglobal(L, fengari.to_luastring("wait"));

          // 3. draw_rect(x, y, w, h, color)
          fengari.lua.lua_pushjsfunction(L, function(L_ptr) {
            const x = fengari.lua.lua_tonumber(L_ptr, 1) || 0;
            const y = fengari.lua.lua_tonumber(L_ptr, 2) || 0;
            const w = fengari.lua.lua_tonumber(L_ptr, 3) || 10;
            const h = fengari.lua.lua_tonumber(L_ptr, 4) || 10;
            const color = fengari.lua.lua_tojsstring(L_ptr, 5) || "#00e676";
            const cvs = document.getElementById('screen-canvas');
            if (cvs) {
              const ctx = cvs.getContext('2d');
              ctx.fillStyle = color;
              ctx.fillRect(x, y, w, h);
            }
            return 0;
          });
          fengari.lua.lua_setglobal(L, fengari.to_luastring("draw_rect"));

          // 4. clear_canvas()
          fengari.lua.lua_pushjsfunction(L, function(L_ptr) {
            const cvs = document.getElementById('screen-canvas');
            if (cvs) {
              const ctx = cvs.getContext('2d');
              ctx.clearRect(0, 0, cvs.width, cvs.height);
            }
            return 0;
          });
          fengari.lua.lua_setglobal(L, fengari.to_luastring("clear_canvas"));

          // 5. play_sound(freq, duration)
          fengari.lua.lua_pushjsfunction(L, function(L_ptr) {
            const freq = fengari.lua.lua_tonumber(L_ptr, 1) || 440;
            const duration = fengari.lua.lua_tonumber(L_ptr, 2) || 0.1;
            try {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (AudioCtx) {
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                osc.type = 'square';
                osc.frequency.value = freq;
                osc.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
              }
            } catch(e) {}
            return 0;
          });
          fengari.lua.lua_setglobal(L, fengari.to_luastring("play_sound"));

          // 6. set_bg(color)
          fengari.lua.lua_pushjsfunction(L, function(L_ptr) {
            const color = fengari.lua.lua_tojsstring(L_ptr, 1) || "#090a0f";
            document.body.style.background = color;
            return 0;
          });
          fengari.lua.lua_setglobal(L, fengari.to_luastring("set_bg"));

          const co = fengari.lua.lua_newthread(L);
          const status = fengari.lauxlib.luaL_loadstring(co, fengari.to_luastring(code));

          if (status !== 0) {
            handleError(fengari.lua.lua_tojsstring(co, -1), consoleOut);
            return;
          }

          function stepExecution() {
            const res = fengari.lua.lua_resume(co, null, 0);
            if (res === fengari.lua.LUA_YIELD) {
              const sec = fengari.lua.lua_tonumber(co, -1) || 0;
              fengari.lua.lua_pop(co, 1);
              setTimeout(stepExecution, sec * 1000);
            } else if (res === fengari.lua.LUA_OK) {
              const timeDiv = document.createElement('div');
              timeDiv.className = 'exec-time';
              timeDiv.textContent = `⏱️ リアルタイム実行完了: ${(performance.now() - startTime).toFixed(2)} ms`;
              consoleOut.appendChild(timeDiv);
              scrollToBottom(consoleOut);
            } else {
              handleError(fengari.lua.lua_tojsstring(co, -1), consoleOut);
            }
          }
          stepExecution();
        } catch(err) { handleError(err.message, consoleOut); }
        return;
      }

      if (lang === 'javascript') {
        const originalLog = console.log;
        console.log = (...args) => {
            const txt = args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
            const div = document.createElement('div'); div.style.color = 'var(--accent-success)'; div.textContent = txt;
            consoleOut.appendChild(div); scrollToBottom(consoleOut);
        };
        try { 
            new Function(code)(); 
            const timeDiv = document.createElement('div'); timeDiv.className = 'exec-time'; timeDiv.textContent = `⏱️ 実行完了: ${(performance.now() - startTime).toFixed(2)} ms`;
            consoleOut.appendChild(timeDiv);
        } catch (err) { handleError(err.stack || err.message, consoleOut); } finally { console.log = originalLog; }
        return;
      }

      try {
        consoleOut.innerHTML = '<span style="color:#ffeb3b;"><i class="fa-solid fa-spinner fa-spin"></i> 実行中...</span>';
        const response = await fetch('https://wandbox.org/api/compile.json', { method: 'POST', body: JSON.stringify({ compiler: wandboxCompilers.python, code: code }) });
        const data = await response.json();
        if (data.compiler_error || data.program_error) {
            handleError(data.compiler_error || data.program_error, consoleOut);
        } else {
            consoleOut.innerHTML = `<span style="color:var(--accent-success);">${escapeHtml(data.program_output || '(出力なし)')}</span><div class="exec-time">⏱️ サーバー実行完了: ${(performance.now() - startTime).toFixed(2)} ms</div>`;
        }
      } catch (err) { consoleOut.innerHTML = `<div class="error-card"><i class="fa-solid fa-wifi"></i> <b>通信エラー:</b><br>${escapeHtml(err.message)}</div>`; }
      scrollToBottom(consoleOut);
    }

    function handleError(errText, consoleOut) {
      let html = `<div class="error-card"><i class="fa-solid fa-triangle-exclamation"></i> <b>エラー:</b><br>${escapeHtml(errText)}</div>`;
      html += analyzeErrorAndSuggest(errText);
      consoleOut.innerHTML = html;
    }

    function escapeHtml(str) { return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  </script>
</body>
</html>
